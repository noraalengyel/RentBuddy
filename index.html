<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>RentBuddy</title>
</head>
<body>
  <div class="container">
    <h1>RentBuddy</h1>
    <p>Real tenant reviews. Real rental transparency.</p>

    <div class="card">
      <h2>Join Early Access</h2>
      <form id="signup-form">
        <input type="text" id="name" placeholder="Full Name" required />
        <input type="email" id="email" placeholder="Email Address" required />
        <button type="submit">Join Waitlist</button>
      </form>

      <p id="response-message"></p>
    </div>
  </div>

   <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbyjTUxDTd64kOq5u7lBZg5m4MmlNML_QeSrmSQZ3-kgmN3GrU54TCzn5hJ8YXNWSWyDuQ/exec";

    document.getElementById("signup-form").addEventListener("submit", e => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;

      fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify({ name, email }),
      })
      .then(() => {
        document.getElementById("response-message").innerText = "You're on the list!";
      })
      .catch(() => {
        document.getElementById("response-message").innerText = "Something went wrong.";
      });
    });
  </script>

</body>
</html>
