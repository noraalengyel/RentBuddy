<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RentBuddy</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="bg"></div>

    <div class="hero-content">
      <p class="badge">Coming Soon</p>

      <h1>RentBuddy</h1>
      <h2>Know Before You Rent</h2>

      <p class="subtitle">
        Real tenant reviews. Hidden costs exposed. Total rental transparency.
      </p>

      <!-- FEATURES -->
      <div class="features">
        <div class="feature">
          <h3>Real Reviews</h3>
          <p>Unfiltered tenant experiences.</p>
        </div>

        <div class="feature">
          <h3>True Costs</h3>
          <p>No hidden fees. No surprises.</p>
        </div>

        <div class="feature">
          <h3>Flat Insights</h3>
          <p>Know what you're walking into.</p>
        </div>
      </div>

      <button id="cta-btn">Get Early Access</button>
    </div>
  </section>

  <!-- FORM -->
  <section id="form-page">
    <div class="form-container">
      <h2>Join Early Access</h2>

      <form id="signup-form">
        <input type="text" id="name" placeholder="Full Name" required />
        <input type="email" id="email" placeholder="Email Address" required />
        <button type="submit">Join Waitlist</button>
      </form>

      <p id="response-message"></p>
    </div>
  </section>

  <script src="script.js"></script>
</body>

</html>
